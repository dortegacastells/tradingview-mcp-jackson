name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Setmanal: dilluns 8:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detecta secrets al codi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
